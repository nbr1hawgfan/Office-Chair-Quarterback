<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1b33">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Office Chair QB">
  <title>Office Chair QB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="app-hdr">
    <button class="hdr-brand" id="hdrTheme" aria-label="Change team colors">
      <img id="hdrLogo" src="icons/icon-192.png" alt="">
      <span><b>OFFICE CHAIR QB</b><small id="hdrTeam">Pick your team</small></span>
    </button>
    <span class="hdr-btns"><button class="icon-btn" id="hdrSearch" aria-label="Search players">🔍</button><button class="icon-btn" id="hdrGear" aria-label="Settings">⚙️</button></span>
  </header>

  <main id="view"></main>

  <nav id="nav">
    <button data-tab="home"><span>🏠</span>Home</button>
    <button data-tab="scores"><span>📺</span>Scores</button>
    <button data-tab="team"><span>⭐</span>My Team</button>
    <button data-tab="players"><span>🃏</span>Players</button>
  </nav>
  <div id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/core.js"></script>
  <script src="js/scores.js"></script>
  <script src="js/team.js"></script>
  <script src="js/players.js"></script>
  <script src="js/more.js"></script>
  <script src="js/pickem.js"></script>
  <script src="js/fantasy.js"></script>
  <script src="js/rivalry.js"></script>
  <script src="js/brief.js"></script>
  <script src="js/gameday.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/ticker.js"></script>
  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
