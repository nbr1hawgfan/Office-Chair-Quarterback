<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<defs>
  <clipPath id="r"><rect width="512" height="512" rx="112"/></clipPath>
  <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0" stop-color="#1b2f57"/><stop offset="0.55" stop-color="#0d1a33"/><stop offset="1" stop-color="#070d1a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
    <stop offset="0" stop-color="#f2c94c" stop-opacity="0.38"/><stop offset="1" stop-color="#f2c94c" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="leather" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8642c"/><stop offset="0.45" stop-color="#8a4318"/><stop offset="1" stop-color="#4f2209"/>
  </linearGradient>
  <radialGradient id="shine" cx="0.38" cy="0.28" r="0.55">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe08a"/><stop offset="0.5" stop-color="#f2c94c"/><stop offset="1" stop-color="#b8861f"/>
  </linearGradient>
  <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a87a17"/><stop offset="0.5" stop-color="#ffe08a"/><stop offset="1" stop-color="#a87a17"/>
  </linearGradient>
  <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.55"/></filter>
</defs>
<g clip-path="url(#r)">
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- yard lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="6">
    <line x1="-40" y1="140" x2="560" y2="20"/><line x1="-40" y1="250" x2="560" y2="130"/><line x1="-40" y1="360" x2="560" y2="240"/><line x1="-40" y1="470" x2="560" y2="350"/><line x1="-40" y1="580" x2="560" y2="460"/>
  </g>
  <circle cx="256" cy="215" r="230" fill="url(#glow)"/>
  <!-- gold bottom band like the app header accent -->
  <rect x="10" y="10" width="492" height="492" rx="102" fill="none" stroke="url(#gold)" stroke-width="7" opacity="0.9"/>
</g>
<g transform="translate(256 256) scale(1.0) translate(-256 -256)">
  <!-- swivel chair base: football sits on it like a trophy -->
  <g filter="url(#sh)">
    <rect x="242" y="330" width="28" height="60" rx="6" fill="url(#goldH)"/>
    <path d="M256 384 L150 418 M256 384 L362 418 M256 384 L206 430 M256 384 L306 430" stroke="url(#goldH)" stroke-width="18" stroke-linecap="round" fill="none"/>
    <circle cx="146" cy="424" r="13" fill="#0a0f1c" stroke="#f2c94c" stroke-width="5"/>
    <circle cx="366" cy="424" r="13" fill="#0a0f1c" stroke="#f2c94c" stroke-width="5"/>
    <circle cx="203" cy="438" r="13" fill="#0a0f1c" stroke="#f2c94c" stroke-width="5"/>
    <circle cx="309" cy="438" r="13" fill="#0a0f1c" stroke="#f2c94c" stroke-width="5"/>
    <!-- seat cradle -->
    <path d="M132 292 Q256 350 380 292 L372 318 Q256 374 140 318 Z" fill="url(#gold)"/><path d="M140 300 Q256 352 372 300" stroke="#fff6cf" stroke-opacity=".55" stroke-width="3" fill="none"/>
  </g>
  <!-- football -->
  <g transform="translate(0 26) rotate(-18 256 196)" filter="url(#sh)">
    <path d="M86 215 C150 112 362 112 426 215 C362 318 150 318 86 215 Z" fill="url(#leather)" stroke="#2b1204" stroke-width="5"/>
    <!-- end stripes -->
    <path d="M150 154 C140 190 140 240 150 276" stroke="#f5efe6" stroke-width="13" fill="none" stroke-linecap="round"/>
    <path d="M362 154 C372 190 372 240 362 276" stroke="#f5efe6" stroke-width="13" fill="none" stroke-linecap="round"/>
    <!-- seam + laces -->
    <path d="M190 200 C230 192 282 192 322 200" stroke="#f5efe6" stroke-width="9" fill="none" stroke-linecap="round"/>
    <g stroke="#f5efe6" stroke-width="9" stroke-linecap="round">
      <line x1="206" y1="182" x2="205" y2="214"/><line x1="230" y1="179" x2="230" y2="211"/><line x1="256" y1="178" x2="256" y2="210"/><line x1="282" y1="179" x2="282" y2="211"/><line x1="306" y1="182" x2="307" y2="214"/>
    </g>
    <path d="M86 215 C150 112 362 112 426 215 C362 318 150 318 86 215 Z" fill="url(#shine)"/>
  </g>
  <!-- sparkle -->
  <path d="M404 84 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8z" fill="#ffe08a"/>
  <path d="M104 110 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" fill="#ffe08a" opacity=".75"/>
</g>
</svg>